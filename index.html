<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>Portfólio Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="h1" style="display:none;">
            Portfólio: The Clicker Game
        </h1>
    </header> 

    <div id="mixer" style="display:none;">
        <br><br>
        <button id="toggleMusic">⏸ Pausar Música</button>
        <br><br>
        <label>Volume:</label>
        <input type="range" id="volumeSlider"
            min="0" max="1" step="0.01" value="0.7">
    </div>

    <div id="lang" style="display:none;">
        <button id="langBtn">
            <img id="flagIcon" src="/assets/images/br.png" alt="Idioma" width="30">
        </button>
    </div>

    <div id="game">
        <h1 id="counter">0</h1>
        <button id="clickBtn">Clique aqui</button>
    </div>

    <div id="store" style="display:none;">
        <h2>Loja</h2>

        <div class="itemStore" style="display:none;" id="itemTitle">
            <p id="itemTitleText">Desbloquear Título (10 Cliques)</p>
            <button id="clickBtnPurchase1">
                Desbloquear
            </button>
        </div>
        <div class="itemStore" style="display:none;" id="itemLanguage">
            <p id="itemLanguageText">Desbloquear Linguagem (30 Cliques)</p>
            <button id="clickBtnPurchase6">
                Desbloquear
            </button>
        </div>
        <div class="itemStore" style="display:none;" id="itemBackground">
            <p id="itemBackgroundText">Desbloquear Background (50 Cliques)</p>
            <button id="clickBtnPurchase2">
                Desbloquear
            </button>
            <audio id="music" src="assets/music.mp3" loop></audio>
        </div>
        <div class="itemStore" style="display:none;" id="itemMusic">
            <p id="itemMusicText">Desbloquear musica (70 Cliques)</p>
            <button id="clickBtnPurchase3">
                Desbloquear
            </button>
        </div>
        <div class="itemStore" style="display:none;" id="itemMixer">
            <p id="itemMixerText">Desbloquear Mixer (25 Cliques)</p>
            <button id="clickBtnPurchase4">
                Desbloquear
            </button>
        </div>
        <div class="itemStore" style="display:none;" id="itemAutoClicker">
            <p id="itemAutoClickerText">Desbloquear Auto Clicker (100 Cliques)</p>
            <button id="clickBtnPurchase5">
                Desbloquear
            </button>
        </div>
    

    </div>

    <script src="script.js"></script>

</body>
</html>
